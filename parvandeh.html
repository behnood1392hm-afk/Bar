<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>آرشیو پرونده‌ها</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17120f;color:#eee;font-family:Tahoma,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.05),transparent 35%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px)}
header{padding:34px 16px 22px;text-align:center;border-bottom:1px solid #5b4635;background:#211914}
h1{margin:0;color:#e7d5bd;font-size:30px;letter-spacing:.5px}
.sub{color:#bca995;line-height:1.9;margin:10px auto;max-width:700px}
.wrap{max-width:1100px;margin:auto;padding:20px 14px}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
input,select,button{font:inherit}
input,select{background:#211914;color:#eee;border:1px solid #705844;border-radius:10px;padding:12px}
input{flex:1;min-width:180px}
button{border:1px solid #80654e;background:#2a201a;color:#f1e2d0;border-radius:10px;padding:11px 14px;cursor:pointer}
button:hover{background:#3a2a20}
.stats{color:#bca995;margin:10px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:linear-gradient(145deg,#261d17,#181310);border:1px solid #5f4a39;border-radius:15px;padding:17px;min-height:210px;box-shadow:0 8px 24px #0005}
.icon{font-size:42px}.num{color:#9d8975;font-size:12px}.card h2{color:#e7d5bd;font-size:18px;margin:8px 0}.tag{display:inline-block;border:1px solid #6c5642;border-radius:20px;padding:5px 9px;color:#cbb8a5;font-size:12px;margin:3px}.open{width:100%;margin-top:14px}
.hidden{display:none}
.detail{background:#211914;border:1px solid #80654e;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0008}
.detail h2{color:#ead9c4}.section{margin-top:20px;padding-top:15px;border-top:1px solid #49382b}
.section h3{color:#c8ab8c}.story,.answer{line-height:2.1;color:#ddd}
.suspect{background:#2a201a;border:1px solid #49382b;border-radius:12px;padding:12px;margin:8px 0}
.suspect b{color:#ead9c4}.clue{margin:8px 0;padding:10px;background:#191410;border-right:3px solid #80654e;border-radius:8px;line-height:1.8}
.lock{position:fixed;right:8px;bottom:8px;width:16px;height:16px;opacity:.06;cursor:pointer}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}.box{background:#211914;border:1px solid #80654e;border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center}
.box input{width:100%;margin:10px 0}
#evil{display:none;background:#100707;color:#eee;min-height:100vh}
#evil header{background:#180606;border-color:#6e1d1d}
#evil h1{color:#e55}.evilcard{border-color:#6e1d1d;background:#1c0808}
@media(max-width:500px){h1{font-size:25px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:12px;min-height:190px}.card h2{font-size:15px}}
</style>
</head>
<body>
<div id="normal">
<header><h1>🗂️ آرشیو پرونده‌ها</h1><div class="sub">پرونده‌های داستانی، معمایی و ماورایی را بررسی کن، سرنخ‌ها را کنار هم بگذار و قبل از دیدن پاسخ، نظریه خودت را بساز.</div></header>
<main class="wrap">
<div class="tools">
<input id="search" placeholder="جست‌وجوی نام یا شماره پرونده..." oninput="render()">
<select id="cat" onchange="render()"><option value="">همه دسته‌ها</option><option>جنایی</option><option>معمایی</option><option>ماورایی</option><option>احضاری</option></select>
<select id="diff" onchange="render()"><option value="">همه سختی‌ها</option><option>آسان</option><option>متوسط</option><option>سخت</option><option>خیلی سخت</option></select>
</div>
<div id="stats" class="stats"></div><div id="grid" class="grid"></div>
<div id="detail" class="detail hidden"></div>
</main>
<div class="lock" onclick="openVault()" title="بخش مخفی"></div>
</div>

<div id="vaultModal" class="modal"><div class="box">
<h2>🔐 پرونده محرمانه</h2><p>رمز ورود را وارد کنید.</p>
<input id="vaultPass" type="password" inputmode="numeric" placeholder="رمز">
<button onclick="unlock()">ورود</button> <button onclick="closeVault()">بستن</button>
<p id="vaultMsg"></p>
</div></div>

<div id="evil">
<header><h1>☠️ آرشیو تاریک پرونده‌ها</h1><div class="sub">نسخه محرمانه و داستانی آرشیو</div></header>
<main class="wrap"><div id="evilGrid" class="grid"></div><button onclick="exitEvil()">بازگشت</button></main>
</div>

{"id":1,"title":"ساعت سیزده — پرونده 001","category":"جنایی","label":"پرونده جنایی","emoji":"🩸","difficulty":"آسان","story":"در هتل قدیمی آریا، یک اتفاق عجیب باعث شد پرونده شماره 001 باز شود. موضوع از ساعت جیبی شروع شد؛ وسیله‌ای که قرار بود بی‌اهمیت باشد اما در زمان نامناسبی پیدا شد. چهار نفر در اطراف ماجرا حضور داشتند و هرکدام روایت متفاوتی ارائه کردند. نکته مهم این است که هیچ‌کدام از سرنخ‌ها به تنهایی جواب را نمی‌دهند. برای حل پرونده باید زمان‌ها، جای اشیا و حرف‌های شاهدان را با هم مقایسه کنید. پرونده از نوع پرونده جنایی است و پاسخ آن با استدلال و توجه به جزئیات به دست می‌آید.","suspects":[{"name":"سامان","role":"مسئول نگهداری محل","note":"زمان‌بندی رفت‌وآمدها را بهتر از همه می‌دانست"},{"name":"رها","role":"پژوهشگر","note":"به اسناد قدیمی دسترسی داشت"},{"name":"کاوه","role":"فروشنده عتیقه","note":"ارزش واقعی بعضی اشیا را می‌دانست"},{"name":"نورا","role":"خبرنگار","note":"دنبال یک داستان قدیمی بود"}],"evidence":["ساعت جیبی که زمان/مکان آن قابل بررسی است","دفتر ثبت وقایع","یک پیام کوتاه","گزارش شاهد"],"clues":["روی ساعت جیبی یک نشانه زمانی دیده می‌شود که با روایت اولیه جور نیست.","دفتر ثبت ورود و خروج هتل قدیمی آریا یک فاصله چند دقیقه‌ای غیرعادی دارد.","یک شاهد گفته صدایی شنیده، اما زمان گفته‌شده با ساعت محل همخوان نیست.","پیامی کوتاه با دو واژه تکرارشونده در پرونده باقی مانده است.","یک شیء معمولی در جای غیرمعمول قرار گرفته و نشان می‌دهد کسی دنبال چیزی می‌گشته."],"question":"کدام روایت با شواهد و ترتیب زمانی سازگار نیست و سرنخ اصلی کدام است؟","answer":"کلید حل پرونده در تناقض زمانی نهفته است: روی ساعت جیبی یک نشانه زمانی دیده می‌شود که با روایت اولیه جور نیست. روایت سامان با این زمان‌بندی سازگار نیست. انگیزه اصلی پنهان کردن یک سند قدیمی بوده و ترتیب درست اتفاق‌ها با کنار هم گذاشتن دو سرنخ زمانی و دفتر ثبت وقایع مشخص می‌شود."},{"id":2,"title":"نامه‌ای که برگشت — پرونده 002","category":"معمایی","label":"پرونده معمایی","emoji":"🧩","difficulty":"متوسط","story":"در کتابخانه باران، یک نامه قدیمی دوباره پیدا شد؛ نامه‌ای که سال‌ها قبل گم شده بود. روی پاکت یک نشانی نوشته شده بود اما تاریخ آن با تاریخ ثبت نامه مطابقت نداشت. چهار نفر به نامه دسترسی داشتند و هرکدام توضیح متفاوتی درباره آن ارائه کردند.","suspects":[{"name":"رها","role":"پژوهشگر","note":"در آرشیو نامه‌های قدیمی کار می‌کرد"},{"name":"کاوه","role":"فروشنده عتیقه","note":"به ارزش اسناد قدیمی علاقه داشت"},{"name":"نورا","role":"خبرنگار","note":"درباره تاریخ کتابخانه تحقیق می‌کرد"},{"name":"سامان","role":"مسئول بایگانی","note":"کلید اتاق اسناد را در اختیار داشت"}],"evidence":["نامه مهرشده","دفتر ثبت بایگانی","یک عکس قدیمی","پاکت نامه"],"clues":["مهر نامه از تاریخی قدیمی‌تر از خود نامه است.","شماره اتاق روی پاکت با شماره اتاق فعلی فرق دارد.","در عکس قدیمی همان پاکت در دست فرد دیگری دیده می‌شود.","دفتر بایگانی یک ثبت ناقص دارد.","یک واژه در متن نامه دوبار با شکل متفاوت نوشته شده است."],"question":"نامه واقعاً چه زمانی نوشته شده و چه چیزی باعث اشتباه در تاریخ آن شده است؟","answer":"سرنخ اصلی اختلاف بین مهر و تاریخ نامه است. نامه در زمان قدیمی‌تری آماده شده اما بعداً دوباره در پاکت قرار گرفته است. ثبت ناقص بایگانی نشان می‌دهد کسی برای پنهان کردن سابقه نامه، ترتیب اسناد را تغییر داده بود."},

let current=null;

function esc(s){
return String(s).replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m]));
}

function render(){
const q=document.getElementById('search').value.trim().toLowerCase();
const c=document.getElementById('cat').value;
const d=document.getElementById('diff').value;

const list=CASES.filter(x=>
(!q||(x.title+" "+x.id).toLowerCase().includes(q))&&
(!c||x.category===c)&&
(!d||x.difficulty===d)
);

document.getElementById('stats').textContent=
`${list.length} پرونده از ${CASES.length} پرونده`;

document.getElementById('grid').innerHTML=list.map(card).join('');
}

function card(x){
return `<article class="card">
<div class="icon">${x.emoji}</div>
<div class="num">پرونده ${String(x.id).padStart(3,'0')}</div>
<h2>${esc(x.title)}</h2>
<span class="tag">${esc(x.label)}</span>
<span class="tag">${esc(x.difficulty)}</span>
<button class="open" onclick="showCase(${x.id})">مشاهده پرونده</button>
</article>`;
}

function showCase(id){
const x=CASES.find(a=>a.id===id);
current=x;

document.getElementById('grid').classList.add('hidden');
document.querySelector('.tools').classList.add('hidden');
document.getElementById('stats').classList.add('hidden');

const d=document.getElementById('detail');
d.classList.remove('hidden');

d.innerHTML=`
<button onclick="back()">← بازگشت به پرونده‌ها</button>

<h2>${x.emoji} ${esc(x.title)}</h2>

<span class="tag">${esc(x.label)}</span>
<span class="tag">${esc(x.difficulty)}</span>

<div class="section">
<h3>📖 داستان</h3>
<div class="story">${esc(x.story)}</div>
</div>

<div class="section">
<h3>👤 مظنون‌ها</h3>
${x.suspects.map(s=>
`<div class="suspect">
<b>${esc(s.name)}</b> — ${esc(s.role)}
<br>${esc(s.note)}
</div>`
).join('')}
</div>

<div class="section">
<h3>📁 مدارک</h3>
${x.evidence.map(e=>
`<div class="clue">📌 ${esc(e)}</div>`
).join('')}
</div>

<div class="section">
<h3>🔎 سرنخ‌ها</h3>
${x.clues.map(e=>
`<div class="clue">${esc(e)}</div>`
).join('')}
</div>

<div class="section">
<h3>❓ سؤال نهایی</h3>

<div class="story">${esc(x.question)}</div>

<textarea id="theory"
placeholder="نظریه خودت را اینجا بنویس..."
style="width:100%;min-height:120px;margin-top:12px;background:#17120f;color:#eee;border:1px solid #705844;border-radius:10px;padding:12px;font:inherit"></textarea>

<button onclick="reveal()">ثبت نظریه و نمایش پاسخ</button>

</div>

<div id="answer" class="section hidden">
<h3>🔐 حل پرونده</h3>
<div class="answer">${esc(x.answer)}</div>
</div>
`;

window.scrollTo({top:0,behavior:'smooth'});
}

function reveal(){
document.getElementById('answer').classList.remove('hidden');
}

function back(){
document.getElementById('detail').classList.add('hidden');
document.getElementById('grid').classList.remove('hidden');
document.querySelector('.tools').classList.remove('hidden');
document.getElementById('stats').classList.remove('hidden');

window.scrollTo({top:0,behavior:'smooth'});
}

function openVault(){
document.getElementById('vaultModal').classList.add('show');
document.getElementById('vaultPass').focus();
}

function closeVault(){
document.getElementById('vaultModal').classList.remove('show');
document.getElementById('vaultMsg').textContent='';
}

function unlock(){

if(document.getElementById('vaultPass').value==='1234'){

closeVault();

document.getElementById('normal').style.display='none';

document.getElementById('evil').style.display='block';

document.getElementById('evilGrid').innerHTML=

CASES.map(x=>
`<article class="card evilcard">
<div class="icon">☠️</div>
<div class="num">پرونده محرمانه ${String(x.id).padStart(3,'0')}</div>
<h2>${esc(x.title)}</h2>
<span class="tag">${esc(x.difficulty)}</span>
<button class="open" onclick="showEvilCase(${x.id})">باز کردن</button>
</article>`
).join('');

}

else{

document.getElementById('vaultMsg').textContent='رمز اشتباه است.';

}

}

function showEvilCase(id){

const x=CASES.find(a=>a.id===id);

document.getElementById('evilGrid').innerHTML=

`<article class="detail">

<button onclick="location.reload()">بازگشت</button>

<h2>☠️ ${esc(x.title)}</h2>

<div class="section">
<h3>📖 پرونده</h3>
<div class="story">${esc(x.story)}</div>
</div>

<div class="section">
<h3>🔎 سرنخ‌ها</h3>
${x.clues.map(e=>
`<div class="clue">${esc(e)}</div>`
).join('')}
</div>

<div class="section">
<h3>🔐 پاسخ</h3>
<div class="answer">${esc(x.answer)}</div>
</div>

</article>`;
}

function exitEvil(){

document.getElementById('evil').style.display='none';

document.getElementById('normal').style.display='block';

render();

}

render();

</script>

    placeholder="اسم مستعار"

    <p id="visitorError" style="color:#ffaaaa"></p>
    <button onclick="saveVisitorName()"
    style="padding:12px;background:#d4af37;border:0;
    border-radius:8px;width:100%">ورود</button>
  </div>
</div>

<script>
const visitorKey = "archiveVisitor";
const statsKey = "archiveStats";
const answerKey = "archiveAnswers";

function getStats(){
  return JSON.parse(localStorage.getItem(statsKey) || 
  '{"total":0,"cases":{}}');
}

function saveVisitorName(){
  const name = document.getElementById("visitorName").value.trim();
  if(!name){
    document.getElementById("visitorError").textContent =
    "لطفاً اسم مستعار وارد کن.";
    return;
  }
  localStorage.setItem(visitorKey,name);
  document.getElementById("visitorPanel").style.display="none";
}

if(!localStorage.getItem(visitorKey)){
  document.getElementById("visitorPanel").style.display="flex";
}

let stats = getStats();
stats.total++;
localStorage.setItem(statsKey,JSON.stringify(stats));

function countCaseVisit(caseId){
  let s = getStats();
  s.cases[caseId] = (s.cases[caseId] || 0) + 1;
  localStorage.setItem(statsKey,JSON.stringify(s));
}

function saveCaseAnswer(caseId,answer){
  let all = JSON.parse(localStorage.getItem(answerKey) || "[]");
  all.push({
    name:localStorage.getItem(visitorKey) || "ناشناس",
    caseId:caseId,
    answer:answer,
    date:new Date().toLocaleString()
  });
  localStorage.setItem(answerKey,JSON.stringify(all));
}

</script>

<script>
function openArchiveAdmin(){
  const password = prompt("رمز مدیریت:");
  if(password !== "1234"){
    alert("رمز اشتباه است!");
    return;
  }

  const stats = JSON.parse(
    localStorage.getItem("archiveStats") ||
    '{"total":0,"cases":{}}'
  );

  const answers = JSON.parse(
    localStorage.getItem("archiveAnswers") || "[]"
  );

  let report = "آمار کل بازدیدها: " + stats.total;
  report += "\n\nبازدید پرونده‌ها:\n";

  for(const id in stats.cases){
    report += id + ": " + stats.cases[id] + "\n";
  }

  report += "\nپاسخ‌ها:\n";

  answers.forEach(a=>{
    report += "\nنام: " + a.name +
    "\nپرونده: " + a.caseId +
    "\nپاسخ: " + a.answer + "\n";
  });

  alert(report);
}
</script>
